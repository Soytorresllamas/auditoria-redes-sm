<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría de Redes · SM México</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,800;1,6..72,500;1,6..72,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  /* cool, structured product neutrals — lets SM red read as the brand accent */
  --bg:#EFF1F4; --surface:#FFFFFF; --panel:#F8F9FB;
  --ink:#15171C; --ink-2:#3C4049; --muted:#646A75; --faint:#9AA0AB;
  --line:#E3E6EB; --line-2:#D2D7DE;
  --red:#E40521; --red-ink:#B00418; --red-wash:#FCEBED;
  --green:#157A38; --green-wash:#E7F3EB; --neg:#BE1409; --neg-wash:#FBE9E7;
  /* categorical line colors (data viz) */
  --c-sm:#E40521; --c-lij:#2563B0; --c-day:#B5841C; --c-cat:#2C8A7B; --c-fun:#7A4A86;
  --ease:cubic-bezier(.16,1,.3,1);
  --z-sticky:100;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Hanken Grotesk',system-ui,sans-serif; line-height:1.5;
  font-feature-settings:'ss01';
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding:0 0 70px;
}
.wrap{max-width:1180px;margin:0 auto;padding:30px 24px 0;animation:fade .28s ease-out}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.masthead{padding-bottom:20px;border-bottom:2.5px solid var(--ink);margin-bottom:2px}
.mh-top{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
  padding-bottom:15px;border-bottom:1px solid var(--line)}
.mh-logo{height:30px;width:auto;display:block}
.mh-head{margin-top:18px}
.kick{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:9px}
h1{font-family:'Newsreader',serif;font-weight:800;font-size:clamp(34px,5vw,58px);line-height:.98;
  letter-spacing:-.015em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--red)}
.hmeta{text-align:right;font-size:12px;color:var(--muted);line-height:1.7;flex-shrink:0}
.hmeta b{color:var(--ink-2);font-weight:600}
.hmeta .live{color:var(--red);font-weight:700}
.hmeta .upd{color:var(--green);font-weight:700;cursor:help}
@media(max-width:560px){.mh-top{align-items:flex-start}.hmeta{text-align:left}}

/* ---------- sticky filter bar ---------- */
.filterwrap{position:sticky;top:0;z-index:var(--z-sticky);background:var(--bg);
  padding:16px 0 14px;margin-top:20px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:20px 26px;align-items:center}
.fgroup{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.flabel{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-right:2px}
.chip{font-family:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.chip .pip{width:9px;height:9px;border-radius:3px;background:var(--dot,var(--faint));flex-shrink:0}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.net.on{background:var(--red);border-color:var(--red);color:#fff}
.reset{margin-left:auto;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
  background:none;border:none;cursor:pointer;padding:6px 4px}
.reset:hover{color:var(--red)}
.reset:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}

/* ---------- KPI stat bar (unified, not card grid) ---------- */
.statbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:26px 0 36px}
.stat{padding:18px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .l{font-size:11.5px;font-weight:600;color:var(--muted)}
.stat .n{font-family:'Newsreader',serif;font-weight:800;font-size:31px;letter-spacing:-.01em;
  margin-top:9px;line-height:1;font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;margin-top:8px;color:var(--faint)}
.pos{color:var(--green)}.negc{color:var(--neg)}

/* ---------- sections ---------- */
.sec-h{font-family:'Newsreader',serif;font-style:italic;font-weight:600;font-size:20px;letter-spacing:-.01em}
.cap{font-family:'Hanken Grotesk';font-size:12px;color:var(--muted);margin-top:3px;font-weight:500}
.grid2{display:grid;grid-template-columns:1.12fr 1fr;gap:22px;margin-bottom:36px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.panel .toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font-family:inherit;font-size:12px;font-weight:600;border:none;background:none;color:var(--muted);
  padding:5px 13px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(21,23,28,.1)}

/* ---------- bars ---------- */
.bar{display:flex;align-items:center;gap:14px;margin:11px 0;font-size:13px}
.bar .lab{width:150px;flex-shrink:0;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:9px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .lab .pip{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.track{flex:1;height:26px;background:var(--panel);border-radius:6px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:6px;transition:width .55s var(--ease)}
.bar .val{width:80px;text-align:right;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- diverging ---------- */
.dv{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:12.5px}
.dv .lab{width:152px;flex-shrink:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600;color:var(--ink-2)}
.dv .mid{flex:1;display:flex;align-items:center;height:22px;position:relative}
.dv .axis{position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--line-2)}
.dv .l-half,.dv .r-half{width:50%;display:flex;align-items:center}
.dv .l-half{justify-content:flex-end}.dv .r-half{justify-content:flex-start}
.dv .seg-b{height:18px;border-radius:4px;transition:width .5s var(--ease)}
.dv .v{width:54px;text-align:right;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
.tablecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:34px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:13px 15px;font-size:12px;
  font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;transition:background .15s}
thead th:hover{background:#23262d}
thead th.num{text-align:right}
thead th .ar{color:var(--red);font-size:10px;margin-left:4px}
thead th:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
tbody td{padding:12px 15px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--panel)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.netdot{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-2)}
.netdot .d{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.hlink{color:var(--ink-2);text-decoration:none;font-weight:600;border-bottom:1px solid var(--line-2);
  padding-bottom:1px;transition:color .15s,border-color .15s;display:inline-flex;align-items:center;gap:4px}
.hlink:hover{color:var(--red);border-color:var(--red)}
.hlink:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
.hlink .ext{font-size:10px;opacity:.55;transition:opacity .15s}
.hlink:hover .ext{opacity:1}
.qname a{color:inherit;text-decoration:none;border-bottom:1.5px solid transparent;transition:border-color .15s}
.qname a:hover{border-color:var(--red)}
.qname a:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
.pill{display:inline-block;padding:3px 11px;border-radius:7px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.up{background:var(--green-wash);color:var(--green)}
.pill.down{background:var(--neg-wash);color:var(--neg)}
.pill.flat{background:var(--panel);color:var(--muted)}
.empty{padding:42px;text-align:center;color:var(--muted);font-style:italic}

/* ---------- frequency matrix ---------- */
.fmx{width:100%;border-collapse:separate;border-spacing:5px;font-size:13px}
.fmx th{font-weight:600;color:var(--muted);font-size:11px;padding:2px 8px 5px;text-align:center;background:none}
.fmx th.row{text-align:left}
.fmx td.row{font-weight:600;color:var(--ink-2);white-space:nowrap;padding-right:6px;font-size:12.5px}
.fmx td.cell{text-align:center;border-radius:7px;padding:7px 6px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;font-family:'Newsreader',serif;font-size:15px;transition:background .3s}
.fmx td.cell .u{display:none}
.fmx td.na{text-align:center;color:var(--faint);background:var(--panel);border-radius:7px;font-size:13px}

/* ---------- qualitative ---------- */
.qrow{padding:15px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:none}
.qtop{display:grid;grid-template-columns:160px auto 1fr;gap:20px;align-items:center}
.qnets{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;margin-left:180px}
.qnet{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--panel);color:var(--ink-2)}
.qnet i{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.qnet .ar{font-weight:800}
.qnet.off{opacity:.45;font-weight:600}
.qname{font-weight:700;display:flex;align-items:center;gap:9px;color:var(--ink)}
.qname .pip{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.qchips{display:flex;gap:9px}
.qchip{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted);min-width:74px}
.qchip .b{font-size:11px;font-weight:700;padding:3px 0;border-radius:6px;width:100%;text-align:center}
.qrow .qh{font-size:12.5px;color:var(--ink-2);line-height:1.5}
@media(max-width:760px){.qtop{grid-template-columns:1fr;gap:10px}.qnets{margin-left:0}}

/* ---------- monthly volume ---------- */
.vlegend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 18px}
.vlegend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.vlegend i{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.vbar{display:flex;align-items:center;gap:14px;margin:8px 0;font-size:13px}
.vbar .vlab{width:40px;flex-shrink:0;font-weight:700;color:var(--ink-2)}
.vtrack{flex:1;height:28px;display:flex;border-radius:6px;overflow:hidden;background:var(--panel)}
.vtrack>div{height:100%;flex-shrink:0;transition:width .5s var(--ease)}
.vbar .vtot{width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-family:'Newsreader',serif;font-size:16px}
.vsum{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:18px}
.vsum b{color:var(--ink);font-family:'Newsreader',serif;font-size:15px}
.vtrack>div{cursor:default}
.vtrack>div:hover{filter:brightness(1.12)}
.vtip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:#fff;padding:9px 12px;border-radius:9px;
  box-shadow:0 6px 22px rgba(21,23,28,.22);max-width:240px}
.vtip .vtl{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.vtip .vtl i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.vtip .vtv{font-family:'Newsreader',serif;font-weight:800;font-size:17px;margin-top:3px;line-height:1}
.vtip .vtm{font-size:10.5px;color:#c2c7d0;margin-top:3px}
/* internal scroll box */
.scrollbox{max-height:312px;overflow-y:auto;margin-top:16px;padding-right:8px;
  scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 10px,#000 calc(100% - 12px),transparent);
          mask-image:linear-gradient(to bottom,transparent,#000 10px,#000 calc(100% - 12px),transparent)}
.scrollbox::-webkit-scrollbar{width:8px}
.scrollbox::-webkit-scrollbar-track{background:transparent}
.scrollbox::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.scrollbox::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ---------- GA4 social→web ---------- */
.ga{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.ga .gacard{border:1px solid var(--line);border-radius:12px;padding:16px}
.ga .gl{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:10px}
.ga .grow{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin:5px 0}
.ga .grow b{font-family:'Newsreader',serif;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.ga .gbad{font-size:11px;font-weight:700;color:var(--neg)}
.ga .gbar{height:7px;border-radius:4px;background:var(--panel);margin-top:3px;overflow:hidden}
.ga .gbar>div{height:100%;background:var(--red)}
@media(max-width:760px){.ga{grid-template-columns:1fr}}

/* ---------- top content ---------- */
.tc-row{display:grid;grid-template-columns:30px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tc-row:first-child{border-top:none}
.tc-rank{font-family:'Newsreader',serif;font-weight:800;font-size:21px;color:var(--line-2);text-align:center}
.tc-rank.top{color:var(--red)}
.tc-main{min-width:0}
.tc-title{font-weight:600;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;margin-top:5px;letter-spacing:.02em}
.tc-metrics{display:flex;gap:18px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;text-align:right}
.tc-metrics b{font-family:'Newsreader',serif;font-size:16px;color:var(--ink);display:block}
.tc-insight{margin-top:18px;padding:15px 18px;background:var(--red-wash);border:1px solid #F2C9CE;border-radius:11px;font-size:12.5px;color:#5b1116;line-height:1.6}
.tc-insight b{color:var(--red)}
.tc-toggle{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0 6px}
@media(max-width:680px){.tc-metrics{gap:10px}.tc-metrics span:nth-child(2){display:none}}

/* ---------- note ---------- */
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 24px;
  font-size:12.5px;color:var(--ink-2);line-height:1.65}
.note b{color:var(--red-ink);font-weight:700}
.note .lead{display:block;font-family:'Newsreader',serif;font-style:italic;font-size:15px;color:var(--ink);margin-bottom:7px}

@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:900px){
  .grid2{grid-template-columns:1fr}
  .statbar{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2n){border-right:none}
  .stat{border-bottom:1px solid var(--line)}
}
@media(max-width:540px){.statbar{grid-template-columns:1fr}.stat{border-right:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useMemo} = React;

const LINE_COLOR={'Grupo SM':'var(--c-sm)','SM LIJ':'var(--c-lij)','Dayton':'var(--c-day)','Escuela Católica':'var(--c-cat)','Fundación SM':'var(--c-fun)'};
const NET_COLOR={'Facebook':'#1877F2','Instagram':'#D6336C','YouTube':'#E60000','LinkedIn':'#0A66C2','TikTok':'#111418'};
const NET_ABBR={'Facebook':'FB','Instagram':'IG','YouTube':'YT','LinkedIn':'LinkedIn','TikTok':'TikTok'};

function App(){
  const [lines,setLines]=useState([]);
  const [nets,setNets]=useState([]);
  const [groupBy,setGroupBy]=useState('line');
  const [stackBy,setStackBy]=useState('red');
  const [topLine,setTopLine]=useState('Fundación SM');
  const [tip,setTip]=useState(null);
  const [sort,setSort]=useState({k:'followers',d:-1});

  const toggle=(arr,set,v)=>set(arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]);
  const filtered=useMemo(()=>DATA.filter(d=>
    (lines.length===0||lines.includes(d.line))&&(nets.length===0||nets.includes(d.net))),[lines,nets]);

  const totFol=filtered.reduce((s,d)=>s+d.followers,0);
  const totGrowth=filtered.reduce((s,d)=>s+(d.growth||0),0);
  const totReach=filtered.reduce((s,d)=>s+d.reach,0);
  const ratios=filtered.map(d=>d.reach/d.followers);
  const avgRatio=ratios.length?ratios.reduce((a,b)=>a+b,0)/ratios.length:0;

  const agg=useMemo(()=>{
    const key=groupBy==='line'?'line':'net';
    const order=groupBy==='line'?LINES:NETS;
    const m={};
    filtered.forEach(d=>{m[d[key]]=(m[d[key]]||0)+d.followers});
    return order.filter(o=>m[o]!=null).map(o=>({name:o,val:m[o],
      color:groupBy==='line'?LINE_COLOR[o]:NET_COLOR[o]})).sort((a,b)=>b.val-a.val);
  },[filtered,groupBy]);
  const aggMax=Math.max(...agg.map(a=>a.val),1);

  const growthRows=useMemo(()=>filtered.filter(d=>d.growth!=null).sort((a,b)=>b.growth-a.growth),[filtered]);
  const gMax=Math.max(...growthRows.map(d=>Math.abs(d.growth)),1);

  const effRows=useMemo(()=>[...filtered].map(d=>({...d,ratio:d.reach/d.followers}))
    .sort((a,b)=>b.ratio-a.ratio).slice(0,8),[filtered]);
  const effMax=Math.max(...effRows.map(d=>d.ratio),1);

  // frequency matrix (posts/mes) — redes con conteo medido
  const FREQ_NETS=['Facebook','Instagram','LinkedIn','YouTube'];
  const freqLines=LINES.filter(l=>lines.length===0||lines.includes(l));
  const freqNets=FREQ_NETS.filter(n=>nets.length===0||nets.includes(n));
  const freqCell=(l,n)=>{const d=filtered.find(x=>x.line===l&&x.net===n);return d&&d.posts!=null?perMonth(d.posts):null;};
  const freqMax=Math.max(...freqLines.flatMap(l=>freqNets.map(n=>freqCell(l,n)||0)),0.1);

  // volumen mensual
  const chAllowed=k=>nets.length===0 || (k==='fb'?nets.includes('Facebook'):(k==='igFeed'||k==='igReel')?nets.includes('Instagram'):k==='li'?nets.includes('LinkedIn'):false);
  const volChans=CH.filter(c=>chAllowed(c.k));
  const cell=(l,k,i)=>MONTHLY[l]&&MONTHLY[l][k]?MONTHLY[l][k][i]:0;
  const monthData=MLBL.map((m,i)=>{
    const segs = stackBy==='red'
      ? volChans.map(c=>({label:c.l,color:c.c,val:freqLines.reduce((s,l)=>s+cell(l,c.k,i),0)}))
      : freqLines.map(l=>({label:l,color:LINE_COLOR[l],val:volChans.reduce((s,c)=>s+cell(l,c.k,i),0)}));
    return {m,segs,total:segs.reduce((s,x)=>s+x.val,0)};
  });
  const monthMax=Math.max(...monthData.map(d=>d.total),1);
  const volTotal=monthData.reduce((s,d)=>s+d.total,0);
  const igFeedT=freqLines.reduce((s,l)=>s+(MONTHLY[l]?sum(MONTHLY[l].igFeed):0),0);
  const igReelT=freqLines.reduce((s,l)=>s+(MONTHLY[l]?sum(MONTHLY[l].igReel):0),0);
  const volLegend = stackBy==='red'?volChans.map(c=>({label:c.l,color:c.c})):freqLines.map(l=>({label:l,color:LINE_COLOR[l]}));

  const tableRows=useMemo(()=>{
    const r=[...filtered];
    r.sort((a,b)=>{
      let va=a[sort.k],vb=b[sort.k];
      if(sort.k==='ratio'){va=a.reach/a.followers;vb=b.reach/b.followers;}
      if(sort.k==='er'){va=a.eng!=null?a.eng/a.reach:-1;vb=b.eng!=null?b.eng/b.reach:-1;}
      if(va==null)va=-1e15;if(vb==null)vb=-1e15;
      if(typeof va==='string')return sort.d*va.localeCompare(vb);
      return sort.d*(va-vb);
    });
    return r;
  },[filtered,sort]);
  const setSortK=k=>setSort(s=>s.k===k?{k,d:-s.d}:{k,d:-1});
  const arrow=k=>sort.k===k?<span className="ar">{sort.d<0?'▼':'▲'}</span>:null;
  const active=lines.length+nets.length>0;

  const signal=g=>{
    if(g==null)return <span className="pill flat">—</span>;
    if(g>=200)return <span className="pill up">▲ crece fuerte</span>;
    if(g>0)return <span className="pill up">▲ crece</span>;
    if(g===0)return <span className="pill flat">▬ plano</span>;
    return <span className="pill down">▼ cae</span>;
  };

  return <div className="wrap">
    <header className="masthead">
      <div className="mh-top">
        <img className="mh-logo" src={SM_LOGO} alt="SM México"/>
        <div className="hmeta">
          Ventana <b>Este año 2026</b> · ene–3 jul · Fuente <b>AgencyAnalytics</b><br/>
          <span className="upd" title="Este tablero se actualiza a pedido, no en tiempo real">● Última actualización: 9-sep-2026</span> · <span className="live">{filtered.length} de {DATA.length} cuentas en vista</span>
        </div>
      </div>
      <div className="mh-head">
        <div className="kick">Dirección de Mercadotecnia · Auditoría de redes</div>
        <h1>Auditoría de <em>redes sociales</em></h1>
      </div>
    </header>

    <div className="filterwrap">
      <div className="filters">
        <div className="fgroup">
          <span className="flabel">Línea</span>
          {LINES.map(l=><Chip key={l} label={l} color={LINE_COLOR[l]} on={lines.includes(l)} onClick={()=>toggle(lines,setLines,l)}/>)}
        </div>
        <div className="fgroup">
          <span className="flabel">Red</span>
          {NETS.map(n=><Chip key={n} net label={n} on={nets.includes(n)} onClick={()=>toggle(nets,setNets,n)}/>)}
        </div>
        {active&&<button className="reset" onClick={()=>{setLines([]);setNets([])}}>Limpiar filtros</button>}
      </div>
    </div>

    <div className="statbar">
      <div className="stat"><div className="l">Seguidores totales</div><div className="n">{fmt(totFol)}</div><div className="s">en la selección</div></div>
      <div className="stat"><div className="l">Crecimiento neto</div><div className={'n '+(totGrowth>=0?'pos':'negc')}>{fmtSign(totGrowth)}</div><div className="s">FB · LinkedIn · YT · TikTok</div></div>
      <div className="stat"><div className="l">Cuentas</div><div className="n">{filtered.length}</div><div className="s">orgánicas activas</div></div>
      <div className="stat"><div className="l">Alcance / Impresiones</div><div className="n">{fmt(totReach)}</div><div className="s">exposición del periodo</div></div>
      <div className="stat"><div className="l">Ratio alcance ÷ segs.</div><div className="n">{avgRatio.toFixed(1)}×</div><div className="s">eficiencia media</div></div>
    </div>

    <div className="grid2">
      <div className="panel">
        <div className="toolbar">
          <div>
            <div className="sec-h">Audiencia</div>
            <div className="cap">Seguidores agregados {groupBy==='line'?'por línea de negocio':'por red social'}.</div>
          </div>
          <div className="seg" role="group" aria-label="Agrupar audiencia">
            <button className={groupBy==='line'?'on':''} onClick={()=>setGroupBy('line')}>Por línea</button>
            <button className={groupBy==='net'?'on':''} onClick={()=>setGroupBy('net')}>Por red</button>
          </div>
        </div>
        {agg.length===0?<div className="empty">Sin datos para esta combinación.</div>:
         agg.map(a=><div className="bar" key={a.name}>
          <div className="lab"><span className="pip" style={{background:a.color}}/>{a.name}</div>
          <div className="track"><div className="fill" style={{width:(a.val/aggMax*100)+'%',background:a.color}}/></div>
          <div className="val">{fmt(a.val)}</div>
        </div>)}
      </div>

      <div className="panel">
        <div className="sec-h">Crecimiento neto</div>
        <div className="cap">Altas menos bajas dentro del periodo, por cuenta.</div>
        <div className="scrollbox">
        {growthRows.length===0?<div className="empty">Sin cuentas con crecimiento medible en la selección.</div>:
         growthRows.map(d=><div className="dv" key={d.line+d.net}>
          <div className="lab">{SHORT[d.line]} · {d.net}</div>
          <div className="mid"><div className="axis"/>
            <div className="l-half">{d.growth<0&&<div className="seg-b" style={{width:(Math.abs(d.growth)/gMax*100)+'%',background:'var(--neg)'}}/>}</div>
            <div className="r-half">{d.growth>=0&&<div className="seg-b" style={{width:(d.growth/gMax*100)+'%',background:'var(--green)'}}/>}</div>
          </div>
          <div className="v" style={{color:d.growth>=0?'var(--green)':'var(--neg)'}}>{fmtSign(d.growth)}</div>
        </div>)}
        </div>
      </div>

    <div className="panel" style={{marginBottom:36}}>
      <div className="sec-h">Eficiencia de alcance</div>

      <div style={{marginTop:16}}>
      {effRows.map(d=><div className="bar" key={d.line+d.net}>
        <div className="lab"><span className="pip" style={{background:NET_COLOR[d.net]}}/>{d.handle.length>24?d.handle.slice(0,24)+'…':d.handle}</div>
        <div className="track"><div className="fill" style={{width:(d.ratio/effMax*100)+'%',background:LINE_COLOR[d.line]}}/></div>
        <div className="val">{d.ratio.toFixed(1)}×</div>
      </div>)}
      </div>
    </div>

    <div className="panel" style={{marginBottom:36}}>
      <div className="sec-h">Frecuencia de publicación</div>
      <div className="cap">Contenido publicado por mes (posts + reels, promedio sobre ~6 meses). Intensidad = cadencia. Dato autoritativo del API de AgencyAnalytics. La cadencia es alta en Facebook y en Instagram por igual.</div>
      {freqLines.length===0||freqNets.length===0?<div className="empty">Sin redes medidas para esta combinación.</div>:
      <div style={{marginTop:14,overflowX:'auto'}}>
      <table className="fmx">
        <thead><tr><th className="row"></th>{freqNets.map(n=><th key={n}><span className="netdot" style={{justifyContent:'center'}}><span className="d" style={{background:NET_COLOR[n]}}/>{n}</span></th>)}</tr></thead>

          {freqLines.map(l=><tr key={l}>
            <td className="row">{l}</td>
            {freqNets.map(n=>{
              const v=freqCell(l,n);
              if(v==null)return <td key={n} className="na">—</td>;
              const a=Math.max(.06, v/freqMax*0.92);
              return <td key={n} className="cell" style={{background:'rgba(228,5,33,'+a.toFixed(2)+')',color:a>0.5?'#fff':'var(--ink)'}}>
                {v.toFixed(1)}<span className="u">por mes</span></td>;
            })}
          </tr>)}
        </tbody>
      </table>
      </div>}
    </div>

    <div className="panel" style={{marginBottom:36}}>
      <div className="toolbar">
        <div>
          <div className="sec-h">Volumen de publicaciones por mes</div>
          <div className="cap">Contenido total publicado cada mes. Instagram desglosado en feed vs reel. (YouTube no disponible por mes; TikTok sin conteo.)</div>
        </div>
        <div className="seg" role="group" aria-label="Apilar volumen">
          <button className={stackBy==='red'?'on':''} onClick={()=>setStackBy('red')}>Por red</button>
          <button className={stackBy==='linea'?'on':''} onClick={()=>setStackBy('linea')}>Por línea</button>
        </div>
      </div>
      {volChans.length===0||freqLines.length===0?<div className="empty">Sin redes con conteo mensual para esta combinación (FB, Instagram o LinkedIn).</div>:<div>
        <div className="vlegend">{volLegend.map(x=><span key={x.label}><i style={{background:x.color}}/>{x.label}</span>)}</div>
        {monthData.map(d=><div className="vbar" key={d.m}>
          <div className="vlab">{d.m}</div>
          <div className="vtrack">{d.segs.map((s,j)=> s.val>0 ? <div key={j} style={{width:(s.val/monthMax*100)+'%',background:s.color}}
            onMouseMove={e=>setTip({x:e.clientX,y:e.clientY,color:s.color,label:s.label,val:s.val,month:d.m,total:d.total})}
            onMouseLeave={()=>setTip(null)}/> : null)}</div>
          <div className="vtot">{d.total}</div>
        </div>)}
        <div className="vsum">
          <span>Total selección: <b>{fmt(volTotal)}</b> publicaciones</span>
          <span>Promedio: <b>{(volTotal/MONTHS).toFixed(0)}</b>/mes</span>
          {(nets.length===0||nets.includes('Instagram')) && <span>Instagram: <b>{igFeedT}</b> feed · <b>{igReelT}</b> reel ({igFeedT+igReelT>0?Math.round(igReelT/(igFeedT+igReelT)*100):0}% reels)</span>}
        </div>
      </div>}
    </div>



    <div className="panel" style={{marginBottom:36}}>
      <div className="sec-h">Top contenido por desempeño <span className="tag" style={{color:'var(--c-lij)'}}>· SOLO INSTAGRAM</span></div>
      <div className="cap"><b>Solo Instagram</b> (reels/posts, ene–jun 2026): las 5 publicaciones de mayor alcance de cada línea. Elige una línea. “G+C” = guardados + compartidos (señal de intención). No incluye Facebook, LinkedIn ni YouTube.</div>
      <div className="tc-toggle">
        {LINES.map(l=><button key={l} className={'chip'+(topLine===l?' on':'')} onClick={()=>setTopLine(l)} style={{'--dot':LINE_COLOR[l]}}><span className="pip"/>{l}</button>)}
      </div>
      <div style={{marginTop:12}}>
        {TOPL[topLine].items.map((c,i)=><div className="tc-row" key={i}>
          <div className={'tc-rank'+(i<2?' top':'')}>{i+1}</div>
          <div className="tc-main">
            <div className="tc-title">{c.t}</div>
            <span className="tc-tag" style={{background:TC_TAG[c.tag].b,color:TC_TAG[c.tag].c}}>{c.tag}</span>
          </div>
          <div className="tc-metrics">
            <span><b>{fmt(c.views)}</b>vistas</span>
            <span><b>{fmt(c.likes)}</b>likes</span>
            <span><b>{fmt(c.ss)}</b>G+C</span>
          </div>
        </div>)}
      </div>
      <div className="tc-insight"><b>{topLine}.</b> {TOPL[topLine].note}</div>
    </div>

    <div className="panel" style={{marginBottom:36}}>
      <div className="sec-h">Diagnóstico cualitativo</div>
      <div className="cap">Identidad, contenido y comunidad evaluadas en las 5 redes (Facebook, Instagram, YouTube, LinkedIn, TikTok). La tira muestra el crecimiento neto por red; “—” = sin presencia. Semáforo: Fuerte · Medio · Débil.</div>
      <div style={{marginTop:16}}>
      {freqLines.length===0?<div className="empty">Sin líneas en la selección.</div>:
       freqLines.map(l=>{const q=QUAL[l];if(!q)return null;return <div className="qrow" key={l}>
        <div className="qtop">
          <div className="qname"><span className="pip" style={{background:LINE_COLOR[l]}}/>{igUrl(l)?<a href={igUrl(l)} target="_blank" rel="noopener noreferrer" title="Abrir Instagram">{l}</a>:l}</div>
          <div className="qchips">
            {[['Identidad',q.id],['Contenido',q.co],['Comunidad',q.cm]].map(([lab,v])=>
              <div className="qchip" key={lab}>{lab}<span className="b" style={{background:RT[v].b,color:RT[v].c}}>{RT[v].t}</span></div>)}
          </div>
          <div className="qh">{q.h}</div>
        </div>
        <div className="qnets">
          {NETS.map(n=>{const d=DATA.find(x=>x.line===l&&x.net===n);
            if(!d)return <span className="qnet off" key={n} title="Sin presencia"><i style={{background:'var(--line-2)'}}/>{NET_ABBR[n]} —</span>;
            const g=d.growth, up=g>0, dn=g<0;
            return <span className="qnet" key={n} title={d.handle+' · '+fmtSign(g)+' netos'}><i style={{background:NET_COLOR[n]}}/>{NET_ABBR[n]} <span className="ar" style={{color:up?'var(--green)':dn?'var(--neg)':'var(--muted)'}}>{up?'▲':dn?'▼':'▬'} {fmtSign(g)}</span></span>;
          })}
        </div>
      </div>;})}
      </div>
    </div>

    <div style={{marginBottom:14}}>
      <div className="sec-h">Detalle por cuenta</div>
      <div className="cap">Clic en cualquier encabezado para ordenar.</div>
    </div>
    <div className="tablecard">
      <table>
        <thead><tr>
          <th tabIndex="0" onClick={()=>setSortK('line')}>Línea{arrow('line')}</th>
          <th tabIndex="0" onClick={()=>setSortK('net')}>Red{arrow('net')}</th>
          <th tabIndex="0" onClick={()=>setSortK('handle')}>Handle{arrow('handle')}</th>
          <th tabIndex="0" className="num" onClick={()=>setSortK('followers')}>Seguidores{arrow('followers')}</th>
          <th tabIndex="0" className="num" onClick={()=>setSortK('growth')}>Crec. neto{arrow('growth')}</th>
          <th tabIndex="0" className="num" onClick={()=>setSortK('reach')}>Alcance/Impr.{arrow('reach')}</th>
          <th tabIndex="0" className="num" onClick={()=>setSortK('ratio')}>Ratio{arrow('ratio')}</th>
          <th tabIndex="0" className="num" onClick={()=>setSortK('posts')}>Cont./mes{arrow('posts')}</th>
          <th tabIndex="0" className="num" onClick={()=>setSortK('er')}>Eng-rate{arrow('er')}</th>
          <th>Señal</th>
        </tr></thead>
        <tbody>
          {tableRows.length===0?<tr><td colSpan="10" className="empty">Sin cuentas para esta combinación de filtros.</td></tr>:
           tableRows.map(d=><tr key={d.line+d.net}>
            <td>{d.line}</td>
            <td><span className="netdot"><span className="d" style={{background:NET_COLOR[d.net]}}/>{d.net}</span></td>
            <td>{d.url?<a className="hlink" href={d.url} target="_blank" rel="noopener noreferrer">{d.handle}<span className="ext">↗</span></a>:<span style={{color:'var(--muted)'}}>{d.handle}</span>}</td>
            <td className="num">{fmt(d.followers)}</td>
            <td className="num" style={{color:d.growth==null?'var(--faint)':d.growth>=0?'var(--green)':'var(--neg)'}}>{d.growth==null?'n/d':fmtSign(d.growth)}</td>
            <td className="num">{fmt(d.reach)}</td>
            <td className="num">{(d.reach/d.followers).toFixed(1)}×</td>
            <td className="num" style={d.posts==null?{color:'var(--faint)'}:null}>{d.posts==null?'n/d':perMonth(d.posts).toFixed(1)}</td>
            <td className="num" style={d.eng==null?{color:'var(--faint)'}:null}>{d.eng==null?'n/d':(d.eng/d.reach*100).toFixed(1)+'%'}</td>
            <td>{signal(d.growth)}</td>
          </tr>)}
        </tbody>
      </table>
    </div>
{(()=>{const gaRows=GA4.filter(g=>lines.length===0||lines.includes(g.line)); if(!gaRows.length)return null; return (
    <div className="panel" style={{marginBottom:36}}>
      <div className="sec-h">¿La red social lleva tráfico a la web?</div>
      <div className="cap">Sesiones del sitio por canal (GA4, ene–3 jul 2026). Solo líneas con GA4 conectado: Grupo SM, Dayton, Fundación.</div>
      <div className="ga">
        {gaRows.map(g=>{const pct=g.social/g.total*100;return <div className="gacard" key={g.line}>
          <div className="gl">{g.line}</div>
          <div className="grow"><span>Sesiones web (total)</span><b>{fmt(g.total)}</b></div>
          <div className="grow"><span>Desde Organic Social</span><b>{fmt(g.social)}</b></div>
          <div className="gbar"><div style={{width:Math.max(pct,1.5)+'%'}}/></div>
          <div className="grow" style={{marginTop:8}}><span>Social = {pct.toFixed(1)}% del tráfico</span><span className="gbad">{g.bounce}% rebote · {g.dur}s</span></div>
        </div>;})}
      </div>
      <div className="tc-insight" style={{marginTop:18}}><b>El alcance social NO se convierte en tráfico web.</b> Aun la cuenta de mayor alcance (Fundación, 535K vistas) manda ~0 sesiones al sitio. El tráfico viene de búsqueda y directo. Además, GA4 no tiene <b>conversiones configuradas</b> (0 en todas) → hoy no se puede medir el ROI de social a negocio. Dos arreglos: enlaces/CTA de social hacia la web, y configurar eventos de conversión.</div>
    </div>);})()}

    <div className="note">
      <span className="lead">Cómo leer estos números</span>
      Datos del <b>API de AgencyAnalytics</b> (MCP), ventana “Este año” (1-ene a 9-sep-2026), idéntica para todas las cuentas. El histórico de la herramienta arranca en feb/mar 2026, así que <b>no hay 12 meses reales de tendencia</b>. <b>Contenido/mes</b> = posts + reels ÷ 8, cifra autoritativa por API (corrige el conteo previo por scroll, que subcontaba Instagram). El <b>crecimiento neto de Instagram sí está disponible</b> por API e incluido. TikTok aún sin conteo de contenido (LinkedIn ya incluido). <b>Eng-rate</b> = interacciones ÷ alcance/impresiones del periodo (YouTube n/d: su engagement no sale del API de métricas). El <b>diagnóstico cualitativo</b> combina las 5 redes (crecimiento, contenido y cobertura por red) con la identidad observada en los perfiles vivos; los tiempos de respuesta a comentarios no se auditaron (muro de login). <b>Actualización:</b> este tablero se refresca a pedido (no en tiempo real); para no exponer credenciales de API en un sitio público, los datos se vuelven a extraer y publicar manualmente. Pendiente: benchmark vs. competencia.
    </div>

    {tip&&<div className="vtip" style={{left:Math.min(tip.x+14,window.innerWidth-250),top:tip.y+14}}>
      <div className="vtl"><i style={{background:tip.color}}/>{tip.label}</div>
      <div className="vtv">{fmt(tip.val)} <span style={{fontSize:'11px',fontWeight:400,color:'#c2c7d0'}}>pub.</span></div>
      <div className="vtm">{tip.month} · {(tip.val/tip.total*100).toFixed(0)}% del mes ({fmt(tip.total)} total)</div>
    </div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
